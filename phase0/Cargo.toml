[package]
name = "phase0"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Phase 0 feasibility tests for the depvigil dependency decision engine"

# phase0 is its own workspace root. The fixtures are separate workspaces and
# must never be compiled or resolved as part of this crate.
[workspace]
resolver = "3"
exclude = []

[dependencies]
relate = "=1.3.0"

[dev-dependencies]
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.2"
tempfile = "3.27.0"
toml = "1.2.3"
