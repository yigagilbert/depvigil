[package]
name = "depvigil"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Graph-native dependency decisions for AI coding agents: simulate a change, record an approval, and invalidate it when the evidence changes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yigagilbert/depvigil"
readme = "README.md"
keywords = ["dependencies", "security", "supply-chain", "advisories", "graph"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# The fixtures are separate workspaces and must never be resolved or built as
# part of this crate.
[workspace]
resolver = "3"
exclude = ["fixtures"]

[lib]
name = "depvigil"
path = "src/lib.rs"

[[bin]]
name = "depvigil"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
flate2 = "1.1.11"
relate = "=1.3.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.3"

[dev-dependencies]
